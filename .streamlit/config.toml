[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
linkColor = "#1D4ED8"
borderColor = "#8492A6"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F5F7FA"
redColor = "#C2353A"
orangeColor = "#B7791F"
greenColor = "#1D4ED8"
blueColor = "#1D4ED8"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap, Inter, 'Segoe UI', sans-serif"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#131F36"
secondaryBackgroundColor = "#1C2B47"
textColor = "#DFE6F1"
borderColor = "#27354F"
primaryColor = "#60A5FA"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
